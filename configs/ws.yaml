# Stage 1 weakly supervised proposition-evidence training.
# Inputs are read-only v3 artifacts generated offline. This configuration does
# not create labels or call an LLM at runtime.

seed: 42
device: cuda

skincap:
  train_csv: /content/drive/MyDrive/Cao học/Experiments/SkinCAP/skincap_47_train.csv
  val_csv: /content/drive/MyDrive/Cao học/Experiments/SkinCAP/skincap_47_val.csv
  test_csv: /content/drive/MyDrive/Cao học/Experiments/SkinCAP/skincap_47_test.csv
  image_root: /content/drive/MyDrive/Cao học/Experiments/SkinCAP/skincap
  image_res: 512
  batch_size: 32
  eval_batch_size: 64
  num_workers: 2

weak_supervision:
  root: /content/drive/MyDrive/Cao học/WeakSup/weak_labels/v3/artifacts
  labels: /content/drive/MyDrive/Cao học/WeakSup/weak_labels/v3/artifacts/labels_raw_v3.npz
  active_masks: /content/drive/MyDrive/Cao học/WeakSup/weak_labels/v3/artifacts/active_masks_v3.npz
  active_csv: /content/drive/MyDrive/Cao học/WeakSup/weak_labels/v3/artifacts/active_propositions_v3.csv
  metadata: /content/drive/MyDrive/Cao học/WeakSup/weak_labels/v3/artifacts/metadata_final_v3.json
  min_labels: 10

stage1:
  bert_model_name: emilyalsentzer/Bio_ClinicalBERT
  image_encoder_name: resnet50
  embed_dim: 768
  attention_heads: 8
  attention_layers: 1
  max_caption_length: 128
  query_chunk_size: 64
  freeze_image_encoder: true
  freeze_text_encoder: true
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-4
  epochs: 30
  early_stopping_patience: 10
  # Best checkpoint: image macro ROC-AUC only, with >=5 PRESENT and >=5 ABSENT on validation.
  selection_min_present: 5
  selection_min_absent: 5
  pos_weight_cap: 10.0
