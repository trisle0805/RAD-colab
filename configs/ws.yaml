# Weak-supervision experiment configuration for the WS branch.
#
# Do not store API or Hugging Face tokens in this file; configure them as
# Colab Secrets / environment variables.

# Repository cloned in the Colab runtime. It must be on branch WS.
repo_dir: /content/RAD-colab

# Verified from notebooks/K34_Proposition_clean.ipynb, cell 4.
# The original SkinCAP inputs are already stored on Drive at this location.
drive_root: /content/drive/MyDrive/Cao học
skincap:
  train_csv: /content/drive/MyDrive/Cao học/Experiments/SkinCAP/skincap_47_train.csv
  val_csv: /content/drive/MyDrive/Cao học/Experiments/SkinCAP/skincap_47_val.csv
  test_csv: /content/drive/MyDrive/Cao học/Experiments/SkinCAP/skincap_47_test.csv
  image_root: /content/drive/MyDrive/Cao học/Experiments/SkinCAP/skincap

# Verified Stage-02 artifacts on Drive. Stage 03 must treat all of these as
# read-only inputs; it must not regenerate, overwrite, or use a repository
# review CSV instead.
ws_root: /content/drive/MyDrive/Cao học/WeakSup
propositions_dir: /content/drive/MyDrive/Cao học/WeakSup/propositions/v1
propositions_final: /content/drive/MyDrive/Cao học/WeakSup/propositions/v1/propositions_final.json
propositions_review: /content/drive/MyDrive/Cao học/WeakSup/propositions/v1/propositions_review.csv
propositions_summary: /content/drive/MyDrive/Cao học/WeakSup/propositions/v1/summary_per_disease.csv
propositions_meta: /content/drive/MyDrive/Cao học/WeakSup/propositions/v1/meta.json

# Verified from notebooks/weak/WS_01_teacher_text.ipynb and the completed
# teacher run supplied by Trí. Stage 03 loads only the saved `model/` folder.
teacher_text_dir: /content/drive/MyDrive/Cao học/Models/weak_supervision/teacher_text/bioclinicalbert_mednli_v1/20261012_162149
teacher_text_model: /content/drive/MyDrive/Cao học/Models/weak_supervision/teacher_text/bioclinicalbert_mednli_v1/20261012_162149/model

# Proposed location for labels that will be generated by the Stage-03 runner.
weak_labels_dir: /content/drive/MyDrive/Cao học/WeakSup/weak_labels/v1

# Stage 03 initial, versioned labeling settings.
seed: 42
text_labeler:
  max_length: 128
  batch_size: 256
  fp16: true
  entailment_threshold: 0.90
  contradiction_threshold: 0.80
image_labeler:
  model_id: JerrryNie/ConceptCLIP
  positive_threshold: 0.80
  negative_threshold: 0.20
llm_verify:
  enabled: true
  provider: openai
  # Non-secret runtime settings. Set `model` when approving real API calls.
  # Credentials are read from OPENAI_API_KEY; OPENAI_BASE_URL is optional.
  model: null
  model_env: OPENAI_MODEL
  api_key_env: OPENAI_API_KEY
  base_url_env: OPENAI_BASE_URL
  group_a: true
  group_b: true
  group_c: false
  group_d: true
  temperature: 0
  max_retries: 3
  prompt_path: /content/RAD-colab/proposition/weak/prompts/llm_verify_v1.txt
  negation_terms:
    - no
    - not
    - without
    - absent
    - absence
    - sparing
    - spared
    - spares
    - unaffected
    - negative
    - free of
    - lack
    - lacks
    - lacking
    - none
    - neither
    - nor
    - denies
    - never